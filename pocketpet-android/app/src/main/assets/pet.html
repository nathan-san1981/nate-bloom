<body>
<!--PET-HOOK-->
<canvas id="c"></canvas>
<!--PET-VOICE-->
<script>
"use strict";
/* Pocket Pet: an original virtual pet with the classic rules (egg, baby, child, teen, adult; meals and snacks, the
   left-or-right game, poop, medicine, lights out, discipline, hunger/happy hearts, weight, care mistakes deciding
   what it grows into). Time keeps passing while it is closed: on open, every missed minute is played out.
   Two editions from one file:
     full  (Galaxy Tab S10 FE+): the original rules, including death by neglect, sickness or old age.
     fire  (her Fire, inside the unicorn clock): half-speed needs, never dies, no discipline tricks, big picture
           buttons, hearts always on screen, the pet sleeps at her bedtime, spoken lines. */
const ED = ((window.PET_EDITION || new URLSearchParams(location.search).get('edition') || 'full') === 'fire') ? 'fire' : 'full';
const FIRE = ED === 'fire';
const KEY = 'pocketpet-v1-' + ED;
const MIN = 60000;

/* ---------------- characters ---------------- */
const SPECIES = [
  {id:'unicorn', name:'Unicorn'}, {id:'dragon', name:'Dragon'}, {id:'kitty', name:'Kitty'}, {id:'bunny', name:'Bunny'},
  {id:'puppy', name:'Puppy'}, {id:'penguin', name:'Penguin'}, {id:'octopus', name:'Octopus'}, {id:'alien', name:'Alien'},
  {id:'robot', name:'Robot'}, {id:'dino', name:'Dino'}];
const SPECIES_BY = SPECIES.reduce((o, s) => { o[s.id] = s; return o; }, {});
const NAMES = ['Sparkle','Luna','Star','Clover','Pip','Biscuit','Bubbles','Ziggy','Mochi','Pebble','Daisy','Comet','Noodle','Peaches','Sunny','Twinkle'];
const SHELLS = [
  {id:'pink', a:'#ff9cc8', b:'#e2649f', ink:'#7a1f4c'}, {id:'lilac', a:'#c8a8ff', b:'#9a74e8', ink:'#43227f'},
  {id:'mint', a:'#9fe8c6', b:'#55c49a', ink:'#1d5c44'}, {id:'sky', a:'#9fd3f5', b:'#5aa7e0', ink:'#1d4b73'},
  {id:'sun', a:'#ffe08a', b:'#f2b53c', ink:'#7a4d07'}, {id:'night', a:'#4a4560', b:'#2b2740', ink:'#e9e4ff'}];
const STAGES = ['egg','baby','child','teen','adult'];

/* ---------------- rules ---------------- */
// minutes per lost heart while awake, by stage (baby, child, teen, adult)
const RULES = FIRE ? {
  hunger: [12, 90, 120, 150], happy: [14, 100, 130, 160], poop: [45, 180, 220, 260], poopSick: 360,
  grow: [30, 12 * 60, 24 * 60], callWait: 30, sickDeath: 0, starveDeath: 0, discipline: false, life: 0
} : {
  hunger: [5, 45, 60, 75], happy: [6, 50, 65, 80], poop: [30, 120, 150, 180], poopSick: 180,
  grow: [65, 24 * 60, 48 * 60], callWait: 15, sickDeath: 12 * 60, starveDeath: 12 * 60, discipline: true, life: [16, 12, 8]
};

/* ---------------- state ---------------- */
let S = null;
function fresh() {
  return {v: 1, ed: ED, seed: (Math.random() * 2147483647) | 0, t: Date.now(), sound: true, shell: FIRE ? 'pink' : 'lilac',
    pet: null, album: [], picking: true};
}
function newPet(species, name) {
  return {species, name, stage: 0, born: Date.now(), lifeMin: 0, stageMin: 0, ageDays: 0, weight: 5,
    hunger: 4, happy: 4, discipline: 0, hTimer: 0, pTimer: 0, poops: [], poopTimer: 0, sick: false, sickMin: 0,
    asleep: false, light: true, lightMistakeNight: false, call: null, callMin: 0, mistakes: 0, stageMistakes: 0,
    snackLog: [], fakeLeft: 0, fakeAt: [], zeroMin: 0, variant: 1, dead: null, x: 8, lifespanDays: 0, meals: 0};
}
function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && j.v === 1) return j; } catch (e) {}
  return fresh();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  scheduleNotice();
}
function rnd() {
  let t = (S.seed = (S.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ---------------- bedtime ---------------- */
function hm(s, d) { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : d; }
function sleepWindow(p) {
  if (FIRE) {
    const b = window.PET_BEDTIME || {};
    return [hm(b.bed, 19 * 60 + 30), hm(b.wake, 7 * 60)];
  }
  return [[20, 20, 21, 22][Math.max(0, p.stage - 1)] * 60, [9, 9, 9, 8][Math.max(0, p.stage - 1)] * 60];
}
function isNight(p, d) {
  const [bed, wake] = sleepWindow(p), m = d.getHours() * 60 + d.getMinutes();
  return bed > wake ? (m >= bed || m < wake) : (m >= bed && m < wake);
}

/* ---------------- one minute of pet life ---------------- */
function startCall(p, kind) { if (!p.call) { p.call = kind; p.callMin = 0; events.push(['call', kind]); } }
function minuteStep(d) {
  const p = S.pet;
  if (!p || p.dead) return;
  p.lifeMin++; p.stageMin++;
  if (p.stage === 0) { if (p.stageMin >= 1) grow(p); return; }
  const si = p.stage - 1;
  // sleep
  const night = isNight(p, d);
  if (night && !p.asleep) { p.asleep = true; p.lightMistakeNight = false; if (p.call !== 'fake') p.call = null; if (p.light) startCall(p, 'light'); events.push(['sleep']); }
  if (!night && p.asleep) {
    p.asleep = false; p.light = true; p.ageDays++; events.push(['wake']);
    if (p.call === 'light') p.call = null;
  }
  // calls answered or missed
  if (p.call) {
    if ((p.call === 'hunger' && p.hunger > 0) || (p.call === 'happy' && p.happy > 0) || (p.call === 'light' && !p.light)) p.call = null;
    else if (++p.callMin >= RULES.callWait) {
      if (p.call === 'fake') { if (RULES.discipline) { p.mistakes++; p.stageMistakes++; } }
      else if (!FIRE || p.call !== 'light') { p.mistakes++; p.stageMistakes++; }
      p.call = null;
    }
  }
  if (p.asleep) {
    if (p.sick) sickTick(p);
    return;
  }
  // hunger and happiness
  p.hTimer++; if (p.hTimer >= RULES.hunger[si]) { p.hTimer = 0; if (p.hunger > 0) { p.hunger--; if (p.hunger === 0) startCall(p, 'hunger'); } }
  p.pTimer++; if (p.pTimer >= RULES.happy[si]) { p.pTimer = 0; if (p.happy > 0) { p.happy--; if (p.happy === 0) startCall(p, 'happy'); } }
  // poop
  p.poopTimer++;
  if (p.poopTimer >= RULES.poop[si] + Math.floor(rnd() * 20) - 10) { p.poopTimer = 0; if (p.poops.length < 4) { p.poops.push(0); events.push(['poop']); } }
  for (let i = 0; i < p.poops.length; i++) p.poops[i]++;
  if (!p.sick && p.poops.some(a => a >= RULES.poopSick)) getSick(p);
  if (p.sick) sickTick(p);
  // discipline tricks (full edition, child and teen)
  if (RULES.discipline && (p.stage === 2 || p.stage === 3) && p.fakeAt.length && p.stageMin >= p.fakeAt[0]) {
    p.fakeAt.shift();
    if (!p.call && p.hunger > 0 && p.happy > 0) startCall(p, 'fake');
  }
  // neglect
  if (p.hunger === 0 && p.happy === 0) p.zeroMin++; else p.zeroMin = 0;
  if (RULES.starveDeath && p.zeroMin >= RULES.starveDeath) return die(p, 'hungry');
  // growing up
  if (p.stage < 4 && p.stageMin >= RULES.grow[si]) grow(p);
  if (RULES.life && p.stage === 4 && p.ageDays >= p.lifespanDays && p.lifespanDays > 0) die(p, 'old');
}
function sickTick(p) { p.sickMin++; if (RULES.sickDeath && p.sickMin >= RULES.sickDeath) die(p, 'sick'); }
function getSick(p) { p.sick = true; p.sickMin = 0; events.push(['sick']); }
function grow(p) {
  p.stage++; p.stageMin = 0;
  if (p.stage >= 3) {
    const score = p.stageMistakes + (RULES.discipline ? Math.floor((100 - p.discipline) / 34) : 0);
    p.variant = score <= 1 ? 0 : score <= 3 ? 1 : 2;
  }
  p.stageMistakes = 0;
  if (p.stage === 1) { p.hunger = 2; p.happy = 2; p.weight = 5; }
  if (RULES.discipline && (p.stage === 2 || p.stage === 3)) {
    const len = RULES.grow[p.stage - 1];
    p.fakeAt = [0, 1, 2].map(() => 60 + Math.floor(rnd() * (len - 120))).sort((a, b) => a - b);
  }
  if (p.stage === 4 && RULES.life) p.lifespanDays = p.ageDays + RULES.life[p.variant] + Math.floor(rnd() * 5);
  events.push(['grow', p.stage]);
}
function die(p, how) {
  p.dead = how; p.call = null; events.push(['die', how]);
}
function catchUp(now) {
  if (!S.pet) { S.t = now; return; }
  let n = 0;
  while (S.t + MIN <= now && n < 60 * 24 * 45) { S.t += MIN; minuteStep(new Date(S.t)); n++; }
  if (n >= 60 * 24 * 45) S.t = now;
}

/* ---------------- actions ---------------- */
function feed(kind) {
  const p = S.pet; if (!p || p.dead || p.stage === 0) return false;
  if (p.asleep) { say('sleepy'); return false; }
  if (p.sick && kind === 'snack') { say('nosnack'); return false; }
  if (kind === 'meal') {
    if (p.hunger >= 4) { anim('nope'); say('full'); return false; }
    p.hunger++; p.weight++; p.meals++;
    anim('eat', {food: 'meal'}); say('yum');
  } else {
    p.happy = Math.min(4, p.happy + 1); p.weight += 2;
    p.snackLog = p.snackLog.filter(t => p.lifeMin - t < 60); p.snackLog.push(p.lifeMin);
    if (p.snackLog.length >= (FIRE ? 6 : 4) && rnd() < (FIRE ? 0.5 : 0.8)) { getSick(p); p.snackLog = []; }
    anim('eat', {food: 'snack'}); say('yummy');
  }
  if (p.call === 'hunger' && p.hunger > 0) p.call = null;
  save(); return true;
}
function lights(on) {
  const p = S.pet; if (!p) return;
  p.light = on; if (!on && p.call === 'light') p.call = null;
  if (!on && p.asleep) say('night'); if (on && p.asleep) say('sleepy');
  beep(on ? 880 : 440, 60); save();
}
function cure() {
  const p = S.pet; if (!p || p.dead || p.stage === 0) return;
  if (!p.sick) { anim('nope'); say('notsick'); return; }
  p.sick = false; p.sickMin = 0; anim('medicine'); say('better'); save();
}
function flush() {
  const p = S.pet; if (!p || p.stage === 0) return;
  if (!p.poops.length) { anim('nope'); return; }
  p.poops = []; anim('flush'); say('clean'); save();
}
function scold() {
  const p = S.pet; if (!p || p.dead || p.stage === 0 || p.asleep) return;
  if (p.call === 'fake') { p.call = null; p.discipline = Math.min(100, p.discipline + 25); anim('scold', {good: true}); }
  else { p.happy = Math.max(0, p.happy - 1); anim('scold', {good: false}); }
  save();
}
function gameResult(won) {
  const p = S.pet; if (!p) return;
  if (won) { p.happy = Math.min(4, p.happy + 1); if (p.call === 'happy') p.call = null; }
  p.weight = Math.max(1, p.weight - 1); save();
}

/* ---------------- sound and voice ---------------- */
let actx = null;
function beep(f, ms, delay) {
  if (!S || !S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + (delay || 0) / 1000;
    o.type = 'square'; o.frequency.value = f; g.gain.value = 0.04;
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + ms / 1000);
  } catch (e) {}
}
function chirp() { beep(1320, 70); beep(1320, 70, 130); beep(1320, 70, 260); }
const LINES = {
  hello: n => `Hi! I'm ${n}!`, hungry: n => `${n} is hungry!`, bored: n => `${n} wants to play!`,
  sleepy: () => `I'm sleepy. Turn off the light, please.`, night: () => `Good night!`, morning: () => `Good morning!`,
  yum: () => `Yum!`, yummy: () => `Yummy snack!`, full: () => `I'm full!`, nosnack: () => `No snacks when I'm sick.`,
  sick: () => `Oh no. I don't feel well.`, better: () => `Thank you! I feel better!`, notsick: () => `I'm not sick!`,
  clean: () => `Yay, all clean!`, poop: () => `Uh oh! Time to clean up.`, grow: () => `I'm growing up!`,
  hatch: () => `Look! I hatched!`, guess: () => `Which way will I look?`, won: () => `You got it!`,
  lost: () => `Oops! Try again.`, winGame: () => `You won the game! Yay!`, loseGame: () => `Good try! Let's play again soon.`,
  pick: () => `Pick your pet!`, name: () => `Pick a name!`, shell: () => `Pick a color!`,
  meadow: n => `${n} went to play in the Rainbow Meadow. Bye bye!`, feed: () => `Feed`, light: () => `Light`,
  play: () => `Play`, medicine: () => `Medicine`, cleanup: () => `Clean up`, check: () => `How am I?`,
  meal: () => `Meal`, snack: () => `Snack`, on: () => `Light on`, off: () => `Light off`, left: () => `Left`, right: () => `Right`,
  sad: n => `${n} is sad. Can you help?`, newEgg: () => `Do you want a new egg?`, album: () => `Pet album`};
for (const s of SPECIES) LINES['sp_' + s.id] = () => s.name;
const VOICE = (function () {
  try { const el = document.getElementById('petVoice'); return el ? JSON.parse(el.textContent).clips : {}; } catch (e) { return {}; }
})();
function vnorm(t) {
  t = t.toLowerCase().replace(/’/g, "'").replace(/…/g, ' ');
  t = t.replace(/[^a-z0-9' ]+/g, ' ');
  return t.split(/\s+/).map(w => w.replace(/^'+|'+$/g, '')).filter(Boolean).join(' ');
}
let voiceEl = null, lastSaid = '', lastSaidAt = 0;
const missingClips = [];
function say(key) {
  if (!FIRE || !S || !S.sound) return;
  const fn = LINES[key]; if (!fn) return;
  const text = fn(S.pet ? S.pet.name : 'Pet');
  const now = Date.now();
  if (text === lastSaid && now - lastSaidAt < 2500) return;
  lastSaid = text; lastSaidAt = now;
  const clip = VOICE[vnorm(text)];
  if (!clip) { missingClips.push(text); return; }
  try { if (voiceEl) voiceEl.pause(); voiceEl = new Audio('data:audio/ogg;base64,' + clip); voiceEl.play().catch(() => {}); } catch (e) {}
}
function allLines() {
  const out = new Set();
  for (const k in LINES) { if (LINES[k].length) NAMES.forEach(n => out.add(LINES[k](n))); else out.add(LINES[k]()); }
  return [...out];
}

/* ---------------- pixel art (made in code: every species x stage x look) ---------------- */
function grid(w, h) { return {w, h, p: new Uint8Array(w * h)}; }
function on(g, x, y) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < g.w && y < g.h) g.p[y * g.w + x] = 1; }
function off(g, x, y) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < g.w && y < g.h) g.p[y * g.w + x] = 0; }
function line(g, x0, y0, x1, y1) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for (let i = 0; i <= n; i++) on(g, x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n); }
function inEll(x, y, cx, cy, rx, ry) { const dx = (x - cx) / rx, dy = (y - cy) / ry; return dx * dx + dy * dy <= 1; }
function ellipse(g, cx, cy, rx, ry, clear) {
  for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
    const px = x + 0.5, py = y + 0.5;
    if (!inEll(px, py, cx, cy, rx, ry)) continue;
    const edge = !inEll(px - 1, py, cx, cy, rx, ry) || !inEll(px + 1, py, cx, cy, rx, ry) || !inEll(px, py - 1, cx, cy, rx, ry) || !inEll(px, py + 1, cx, cy, rx, ry);
    if (edge) on(g, x, y); else if (clear) off(g, x, y);
  }
}
function rect(g, x0, y0, x1, y1, clear) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (x === x0 || x === x1 || y === y0 || y === y1) on(g, x, y); else if (clear) off(g, x, y);
  }
}
const spriteCache = {};
// Pet sprites are 16x16. frame 0/1 = step, blink = eyes closed, mood: 'ok' | 'happy' | 'sad' | 'sick' | 'angry'
function petSprite(species, stage, variant, frame, mood) {
  const k = [species, stage, variant, frame, mood].join('/');
  if (spriteCache[k]) return spriteCache[k];
  const g = grid(16, 16);
  if (stage === 0) { egg(g, species, frame); return spriteCache[k] = g; }
  const size = [0, [3.6, 3], [4.4, 3.8], [5, 4.4], [5.6, 4.9]][stage];
  const shape = {penguin: [0.8, 1.12], dino: [1.12, 0.86], octopus: [1, 0.95], robot: [0.92, 0.95], bunny: [0.9, 1]}[species] || [1, 1];
  const rx = size[0] * shape[0], ry = size[1] * shape[1];
  const bob = frame === 1 ? 1 : 0;
  const cy = 15 - ry - (stage === 4 ? 1.5 : 0.5) + bob, cx = 8;
  const top = cy - ry, bottom = cy + ry, left = cx - rx, right = cx + rx;
  const B = {cx, cy, rx, ry, top, bottom, left, right, stage, frame, variant};
  // body
  if (species === 'robot') rect(g, Math.round(left + 0.5), Math.round(top + 0.5), Math.round(right - 0.5), Math.round(bottom - 0.5), true);
  else if (species === 'octopus') ellipse(g, cx, cy - 0.8, rx, ry * 0.9, true);
  else ellipse(g, cx, cy, rx, ry, true);
  FEATURES[species](g, B);
  // feet for older stages (not octopus, which has tentacles)
  if (stage >= 3 && species !== 'octopus' && species !== 'robot') { on(g, cx - 3, bottom + 0.5); on(g, cx + 2, bottom + 0.5); }
  if (stage >= 3 && species === 'robot') { line(g, cx - 3, bottom + 0.5, cx - 3, bottom + 1); line(g, cx + 2, bottom + 0.5, cx + 2, bottom + 1); }
  // face
  const ey = Math.round(cy - ry * 0.25), ex = stage === 1 ? 2 : 2.5;
  const eyeL = Math.round(cx - ex - 0.5), eyeR = Math.round(cx + ex - 0.5);
  if (frame === 2 || mood === 'sleep') { on(g, eyeL, ey); on(g, eyeL + 1, ey); on(g, eyeR, ey); on(g, eyeR - 1, ey); }
  else if (mood === 'happy') { on(g, eyeL - 1, ey); on(g, eyeL, ey - 1); on(g, eyeL + 1, ey); on(g, eyeR - 1, ey); on(g, eyeR, ey - 1); on(g, eyeR + 1, ey); }
  else if (mood === 'angry') { on(g, eyeL, ey); on(g, eyeR, ey); on(g, eyeL - 1, ey - 1); on(g, eyeR + 1, ey - 1); }
  else if (variant === 2 && stage >= 3) { on(g, eyeL, ey); on(g, eyeL - 1, ey); on(g, eyeR, ey); on(g, eyeR + 1, ey); on(g, eyeL, ey + 1); on(g, eyeR, ey + 1); }
  else { on(g, eyeL, ey); on(g, eyeR, ey); if (stage >= 3) { on(g, eyeL, ey - 1); on(g, eyeR, ey - 1); } }
  if (species === 'alien' && stage === 4) on(g, cx - 0.5, ey - 2);
  const my = Math.round(ey + (stage === 1 ? 2 : 2.5));
  if (species !== 'penguin') {
    if (mood === 'sad' || mood === 'sick') { on(g, cx - 2, my + 1); on(g, cx - 1, my); on(g, cx, my); on(g, cx + 1, my + 1); }
    else if (mood === 'happy' || frame === 1) { on(g, cx - 2, my); on(g, cx - 1, my + 1); on(g, cx, my + 1); on(g, cx + 1, my); }
    else { on(g, cx - 1, my); on(g, cx, my); }
  }
  // looks from care: best = crown, scruffy = messy fluff
  if (stage >= 3 && variant === 0) { const y = Math.round(top) - 2; line(g, cx - 2, y + 1, cx + 1, y + 1); on(g, cx - 2, y); on(g, cx - 0.5, y - 1); on(g, cx + 1, y); }
  if (stage >= 3 && variant === 2) { on(g, cx - 3, top - 1); on(g, cx + 3, top - 1); on(g, cx - 4, cy + 2); }
  return spriteCache[k] = g;
}
function egg(g, species, frame) {
  const tilt = frame === 1 ? 0.6 : 0;
  ellipse(g, 8 + tilt, 9, 4.6, 5.8, true);
  const i = SPECIES.findIndex(s => s.id === species);
  const pats = [
    () => { line(g, 5, 9, 7, 7); line(g, 7, 7, 9, 9); line(g, 9, 9, 11, 7); },
    () => { on(g, 6, 7); on(g, 10, 8); on(g, 7, 11); on(g, 9, 12); on(g, 8, 5); },
    () => { line(g, 5, 8, 11, 8); line(g, 5, 11, 11, 11); },
    () => { on(g, 7, 6); on(g, 9, 6); on(g, 8, 9); on(g, 6, 11); on(g, 10, 11); },
    () => { line(g, 6, 7, 10, 11); line(g, 10, 7, 6, 11); },
    () => { ellipse(g, 8, 10, 2, 2); },
    () => { line(g, 5, 10, 6, 9); line(g, 6, 9, 7, 10); line(g, 7, 10, 8, 9); line(g, 8, 9, 9, 10); line(g, 9, 10, 10, 9); line(g, 10, 9, 11, 10); },
    () => { on(g, 8, 6); line(g, 6, 9, 10, 9); on(g, 8, 12); },
    () => { rect(g, 6, 8, 10, 11); },
    () => { line(g, 5, 7, 11, 13); on(g, 7, 6); on(g, 10, 7); }];
  (pats[i] || pats[0])();
}
const FEATURES = {
  unicorn(g, b) {
    const n = b.stage + 1, x = b.cx + 1.5, y = b.top + 0.5;
    for (let i = 1; i <= n; i++) on(g, x + i * 0.6, y - i);

}
function blitArt(rows, x, y, flip) {
  for (let yy = 0; yy < rows.length; yy++) for (let xx = 0; xx < rows[yy].length; xx++) if (rows[yy][xx] === '#') on(lcd, x + (flip ? rows[yy].length - 1 - xx : xx), y + yy);
}

  s = String(s).toUpperCase();
  for (const ch of s) { const f = FONT[ch] || FONT[' ']; for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (f[r] & (4 >> c)) on(lcd, x + c, y + r); x += 4; }
}

const ANIM_LEN = {eat: 2400, nope: 1200, medicine: 2000, flush: 1800, scold: 1600, grow: 3000, hatch: 2400, game: 0};

function moodOf(p) {
  if (p.dead) return 'sad';
  if (p.asleep) return 'sleep';
  if (p.sick) return 'sick';
  if (p.hunger === 0 || p.happy === 0) return 'sad';
  if (p.happy >= 4 && p.hunger >= 3) return 'happy';
  return 'ok';
}
function drawLCD(now) {
  lclear();
  const p = S.pet;
  if (!p) return;
  const tick = Math.floor(now / 500);
  if (p.dead) {
    const y = 4 + (tick % 2);
    blitArt(SMALL.halo, 12, y - 4); blitArt(SMALL.ghost, 12, y);
    return;
  }
  if (A) return drawAnim(now, p);
  if (ui.mode === 'food') { blitArt(SMALL.meal, 9, 2); ltext('MEAL', 15, 2); blitArt(SMALL.snack, 9, 9); ltext('SNCK', 15, 9); blitArt(SMALL.arrowR, 2, ui.cur ? 9 : 2); return; }
  if (ui.mode === 'light') { ltext('ON', 12, 2); ltext('OFF', 12, 9); blitArt(SMALL.arrowR, 5, ui.cur ? 9 : 2); return; }
  if (ui.mode === 'meter') return drawMeter(p);
  if (ui.mode === 'game') return drawGame(now, p);
  if (ui.mode === 'confirm') { ltext('NEW', 10, 2); ltext('EGG?', 8, 9); return; }
  // the main screen
  if (p.stage === 0) { blit(petSprite(p.species, 0, 0, tick % 2), 8, 0); return; }
  if (!p.light) { // dark screen: only zzz
    for (let i = 0; i < 3; i++) if ((tick + i) % 3 !== 0) blitArt(SMALL.z, 20 + i * 3, 2 + i * 4 - (i * 2));
    lcd.p = lcd.p.map(v => v ? 0 : 1);
    return;
  }
  const mood = moodOf(p);
  const walking = !p.asleep && !p.sick && mood !== 'sad';
  if (walking && tick % 2 === 0 && ui.lastStep !== tick) {
    ui.lastStep = tick;
    const step = Math.random() < 0.5 ? -1 : 1;
    p.x += step; ui.flip = step > 0;
  }
  const room = p.poops.length ? 5 : 16; // the poop corner is kept clear
  p.x = Math.max(0, Math.min(room, p.x));
  const frame = p.asleep ? 2 : (tick % 2);
  blit(petSprite(p.species, p.stage, p.variant, frame, mood), p.x, 0, ui.flip);
  if (p.asleep) for (let i = 0; i < 2; i++) if ((tick + i) % 2) blitArt(SMALL.z, 26 - i * 4, 1 + i * 4);
  p.poops.forEach((_, i) => blitArt(SMALL.poop, 27 - (i % 2) * 6 + (tick % 2 && i % 2 === 0 ? 0 : 0), 10 - Math.floor(i / 2) * 6));
  if (p.sick) blitArt(SMALL.skull, p.x > 10 ? 1 : 26, 1);
}
function drawMeter(p) {
  const pages = RULES.discipline ? 4 : 3, pg = ui.page % pages;
  if (pg === 0) { ltext('AGE ' + p.ageDays, 1, 1); ltext('WT ' + p.weight + 'G', 1, 9); }
  else if (pg === 1) { ltext('HUNGRY', 4, 0); hearts(p.hunger, 9); }
  else if (pg === 2) { ltext('HAPPY', 6, 0); hearts(p.happy, 9); }
  else { ltext('DISC', 8, 0); bar(Math.round(p.discipline / 25), 9); }
}
function drawGame(now, p) {
  const G = ui.game;
  const pet = petSprite(p.species, p.stage, p.variant, 0, G.res === 'won' ? 'happy' : G.res === 'lost' ? 'sad' : 'ok');
  if (G.phase === 'ask') {
    blit(pet, 8, 0); ltext('?', 2, 2); ltext('?', 27, 2);
  } else if (G.phase === 'show') {
    blit(pet, 8, 0, G.look === 1);
    blitArt(G.look ? SMALL.arrowR : SMALL.arrowL, G.look ? 26 : 1, 6);
  } else if (G.phase === 'score') {
    ltext(G.wins + '-' + (G.round - G.wins), 10, 2);
    ltext(G.wins >= G.need ? 'WIN!' : 'LOSE', 8, 9);
  }
}
function drawAnim(now, p) {
  const t = now - A.t0, tick = Math.floor(now / 300);
  const pet = (mood, f) => petSprite(p.species, p.stage, p.variant, f || 0, mood);
  switch (A.type) {
    case 'eat': {
      const bite = Math.min(3, Math.floor(t / 600));
      blit(pet('happy', tick % 2), 12, 0);
      const art = A.food === 'meal' ? SMALL.meal : SMALL.snack;
      blitArt(art, 4, 9);
      for (let i = 0; i < bite; i++) for (let y = 0; y < 5; y++) off(lcd, 8 - i, 9 + y);
      break;
    }
    case 'nope': blit(pet('ok', 0), 8, 0, tick % 2 === 0); break;
    case 'medicine': blit(pet('sick', 0), 12, 0); blitArt(SMALL.syringe, 2 + Math.min(6, Math.floor(t / 200)), 4); break;
    case 'flush': {
      blit(pet('happy', tick % 2), Math.max(0, p.x), 0);
      const x = LW - Math.floor((t / ANIM_LEN.flush) * (LW + 4));
      for (let y = 0; y < LH; y++) { on(lcd, x + (y % 4 < 2 ? 0 : 1), y); on(lcd, x + 2 + (y % 4 < 2 ? 0 : 1), y); for (let xx = x + 4; xx < LW; xx++) off(lcd, xx, y); }

    case 'scold': blit(pet(A.good ? 'sad' : 'angry', 0), 12, 0); if (tick % 2) blitArt(SMALL.bang, 6, 4); break;

      else blit(pet('happy', 0), 8, 0);
      break;
    }
    case 'hatch': {
      if (t < 1400) blit(petSprite(p.species, 0, 0, tick % 2), 8, 0);
      else blit(pet('happy', tick % 2), 8, 0);

    }
  }

/* ---------------- game: left or right ---------------- */
function startGame() {
  const p = S.pet;
  if (!p || p.stage === 0 || p.dead) return;
  if (p.asleep) { say('sleepy'); return; }
  if (p.sick) { anim('nope'); say('sick'); return; }
  ui.mode = 'game'; ui.game = {round: 0, wins: 0, rounds: FIRE ? 3 : 5, need: FIRE ? 2 : 3, phase: 'ask', res: null, look: 0, t: 0};
  say('guess');
}
function guess(dir) {
  const G = ui.game; if (!G || G.phase !== 'ask') return;
  G.look = rnd() < 0.5 ? 0 : 1;
  G.phase = 'show'; G.round++; G.t = performance.now();
  const ok = G.look === dir; if (ok) G.wins++;
  G.res = ok ? 'won' : 'lost';
  beep(ok ? 1320 : 330, 120); say(ok ? 'won' : 'lost');
}
function gameTick(now) {
  const G = ui.game; if (!G) return;
  if (G.phase === 'show' && now - G.t > 1300) {
    G.res = null;
    if (G.round >= G.rounds || G.wins >= G.need || (G.round - G.wins) > G.rounds - G.need) { G.phase = 'score'; G.t = now; const won = G.wins >= G.need; gameResult(won); say(won ? 'winGame' : 'loseGame'); }
    else G.phase = 'ask';
  } else if (G.phase === 'score' && now - G.t > 2200) { ui.mode = 'main'; ui.game = null; }
}

/* ---------------- input: icons, A/B/C, choices ---------------- */
function useIcon(name) {
  const p = S.pet;

  if (FIRE) say({food: 'feed', light: 'light', game: 'play', medicine: 'medicine', bath: 'cleanup', meter: 'check', discipline: null}[name] || '');
  ui.sel = ICON_ORDER.indexOf(name);
  if (p.dead || p.stage === 0) return;
  switch (name) {
    case 'food': ui.mode = 'food'; ui.cur = 0; break;
    case 'light': ui.mode = 'light'; ui.cur = p.light ? 1 : 0; break;
    case 'game': startGame(); break;
    case 'medicine': cure(); break;
    case 'bath': flush(); break;
    case 'meter': ui.mode = 'meter'; ui.page = 0; break;
    case 'discipline': scold(); break;

}

function confirmBoxes() { const w = Math.min(620, W - 40), x = (W - w) / 2, y = H / 2 + 30; return [{k: 'yes', label: 'Yes, new egg', x: x + 20, y, w: w / 2 - 30, h: 74}, {k: 'no', label: 'No, keep ' + (S.pet ? S.pet.name : ''), x: x + w / 2 + 10, y, w: w / 2 - 30, h: 74}]; }

/* ---------------- touches ---------------- */
function hit(b, x, y) { return b && x >= b.x && y >= b.y && x <= b.x + b.w && y <= b.y + b.h; }
function tap(x, y) {
  unlockAudio();
  if (menuOpen) return tapMenu(x, y);
  if (typeof window.PET_EXIT === 'function' && hit(L.home, x, y)) { window.PET_EXIT(); return; }
  if (S.picking || !S.pet) return tapPick(x, y);
  if (hit(L.gear, x, y)) { menuOpen = 'main'; beep(1046, 30); return; }
  const p = S.pet;
  if (!FIRE) {
    for (const b of L.buttons) if (Math.hypot(x - b.x, y - b.y) <= b.r * 1.25) { ({A: pressA, B: pressB, C: pressC})[b.k](); return; }
  }
  if (FIRE) {
    const ch = choices();
    if (ch.length && !A) { for (let i = 0; i < ch.length; i++) { const c = ch[i]; if (hit(choiceBox(i), x, y)) { beep(1046, 30); say(c.k); c.go(); return; } } }
  }
  for (const ic of L.icons) if (hit(ic, x, y) && ic.n !== 'call') { if (ui.mode !== 'main' && ui.mode !== 'game') ui.mode = 'main'; if (ui.mode === 'game') return; useIcon(ic.n); return; }
  // a tap on the screen: picks the top/left or bottom/right option
  if (hit({x: L.lcd.x, y: L.lcd.y, w: L.lcd.w, h: L.lcd.h}, x, y)) {
    const left = x < L.lcd.x + L.lcd.w / 2, upper = y < L.lcd.y + L.lcd.h / 2;
    if (p.dead && !FIRE) { newEggFlow(); return; }
    if (ui.mode === 'food') { ui.mode = 'main'; feed(upper ? 'meal' : 'snack'); }
    else if (ui.mode === 'light') { ui.mode = 'main'; lights(upper); }
    else if (ui.mode === 'game') guess(left ? 0 : 1);
    else if (ui.mode === 'meter') ui.page++;
  }
}
function tapPick(x, y) {
  if ((S.album.length || pick.step !== 'species') && hit(backBtn(), x, y)) {
    if (pick.step === 'species') menuOpen = 'album'; else pick.step = pick.step === 'shell' ? 'name' : 'species';
    return;
  }
  if (pick.step === 'species') { for (const t of pickTiles()) if (hit(t, x, y)) { pick.species = t.id; beep(1046, 40); say(t.id === 'surprise' ? 'pick' : 'sp_' + t.id); setTimeout(() => { pick.step = 'name'; say('name'); }, 350); return; } }
  else if (pick.step === 'name') { for (const t of nameTiles()) if (hit(t, x, y)) { pick.name = t.id; beep(1046, 40); pick.step = 'shell'; say('shell'); return; } }
  else {
    for (const t of shellTiles()) if (hit(t, x, y)) { S.shell = t.id; beep(1046, 40); save(); return; }
    if (hit(startBtn(), x, y)) { finishPick(); beep(1320, 80); }
  }
}
function tapMenu(x, y) {
  if (menuOpen === 'album') { menuOpen = null; return; }
  if (menuOpen === 'shell') { for (const t of shellTiles()) if (hit(t, x, y)) { S.shell = t.id; save(); } menuOpen = null; return; }
  if (menuOpen === 'confirm') {
    for (const b of confirmBoxes()) if (hit(b, x, y)) { if (b.k === 'yes') { if (FIRE) say('meadow'); menuOpen = null; newEggFlow(); } else menuOpen = null; return; }
    return;
  }
  for (const b of menuBoxes()) if (hit(b, x, y)) {
    if (b.k === 'album') menuOpen = 'album';
    else if (b.k === 'shell') menuOpen = 'shell';
    else if (b.k === 'sound') { S.sound = !S.sound; save(); }
    else if (b.k === 'newegg') { menuOpen = 'confirm'; say('newEgg'); }
    else menuOpen = null;
    return;
  }
  menuOpen = null;
}
let audioUnlocked = false;
function unlockAudio() { if (audioUnlocked) return; audioUnlocked = true; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) {} }
cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(e.clientX, e.clientY); });
window.addEventListener('keydown', e => {
  if (e.key === 'a' || e.key === 'ArrowLeft') pressA(); else if (e.key === 'b' || e.key === 'Enter' || e.key === 'ArrowRight') pressB(); else if (e.key === 'c' || e.key === 'Escape') pressC();
});

/* ---------------- events (calls, growing up) -> sounds and spoken lines ---------------- */
function handleEvents(live) {
  while (events.length) {
    const [e, x] = events.shift();
    if (!live) continue;
    if (e === 'call') { if (!FIRE || x !== 'fake') chirp(); say({hunger: 'hungry', happy: 'bored', light: 'sleepy'}[x] || ''); }
    else if (e === 'grow') { anim(x === 1 ? 'hatch' : 'grow'); say(x === 1 ? 'hatch' : 'grow'); chirp(); }
    else if (e === 'sick') say('sick');
    else if (e === 'poop') say('poop');
    else if (e === 'wake') say('morning');
    else if (e === 'die') chirp();
  }
}

/* ---------------- notices on the S10 FE+ app (Android bridge), when the pet will next call ---------------- */
function nextCallIn() {
  if (!S.pet || S.pet.dead || S.picking) return -1;
  const saved = JSON.stringify(S), ev = events.length;
  let found = -1;
  try {
    const p = S.pet; p.call = null;
    let t = S.t;
    for (let i = 0; i < 24 * 60; i++) { t += MIN; minuteStep(new Date(t)); if (S.pet.call || S.pet.dead) { found = t; break; } }
  } catch (e) {}
  S = JSON.parse(saved); events.length = ev;
  return found;
}
let noticeTimer = 0;
function scheduleNotice() {
  if (!window.PetAndroid || typeof window.PetAndroid.schedule !== 'function') return;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => {
    const at = nextCallIn();
    try {
      if (at > 0) window.PetAndroid.schedule(String(at), S.pet.name + ' is calling', S.pet.name + ' needs you!');
      else window.PetAndroid.cancel();
    } catch (e) {}
  }, 300);
}

/* ---------------- main loop ---------------- */
function frame(now) {
  const real = Date.now();
  if (S.pet && !S.picking) { catchUp(real); handleEvents(true); }
  if (A && now - A.t0 > (ANIM_LEN[A.type] || 1500)) A = null;
  if (ui.mode === 'game') gameTick(now);
  render(now);
  requestAnimationFrame(frame);
}
S = load();
if (S.ed !== ED) S.ed = ED;
catchUp(Date.now()); handleEvents(false);
save();
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { catchUp(Date.now()); handleEvents(false); } });
setInterval(save, 60000);
resize();
requestAnimationFrame(frame);
if (S.picking) setTimeout(() => say('pick'), 600);

/* test and tooling hooks */
window.__petSprite = petSprite;
window.PET = {
  state: () => S, ui: () => ui, edition: ED, allLines, missingClips: () => missingClips.slice(), vnorm,
  advance(min) { const n = Math.floor(min); S.t -= n * MIN; catchUp(Date.now()); handleEvents(false); save(); },
  setPet(sp, stage, opts) { if (!S.pet) { pick.species = sp; finishPick(); } Object.assign(S.pet, {species: sp, stage}, opts || {}); S.picking = false; save(); },
  save, tap, pressA, pressB, pressC, feed, lights, cure, flush, scold, startGame, guess, newEggFlow, layout: () => L, pick: () => pick, menu: m => { menuOpen = m; }
};
</script>
