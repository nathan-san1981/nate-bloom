name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NB_VERSION_CODE: ${{ github.run_number }}
      NB_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the APK
        id: build
        run: |
          mkdir -p /tmp/nb-logs
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/nb-logs/build.log

      - name: Enable KVM for the emulator
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          pip install --quiet websocket-client

      - name: Smoke test on a tablet-sized emulator
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          script: bash android/ci/smoke.sh /tmp/nb-logs/smoke

      - name: Release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=1.0.${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk "NateBloom-$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk NateBloom.apk
          gh release create "android-v$V" "NateBloom-$V.apk" NateBloom.apk \
            --title "Nate Bloom for Android $V" --notes-file android/RELEASE_NOTES.md --latest

      - name: Publish logs to the ci-logs branch
        if: always()
        run: |
          cd /tmp/nb-logs || exit 0
          echo "${{ github.run_number }} ${{ github.sha }} build=${{ steps.build.outcome }}" > run.txt
          git init -q && git checkout -q -b ci-logs
          git config user.name "nb-ci" && git config user.email "nb-ci@users.noreply.github.com"
          git add -A && git commit -qm "Android run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
