name: Family Games installer (S10 FE+)

on:
  push:
    branches: [main]
    paths: ["family-games-android/**", ".github/workflows/family-games-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: family-games-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FG_VERSION_CODE: ${{ github.run_number }}
      FG_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build the APK
        run: |
          mkdir -p /tmp/pp
          set -o pipefail
          gradle -p family-games-android assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/pp/build.log
          cp family-games-android/app/build/outputs/apk/release/app-release.apk /tmp/pp/FamilyGames.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: /tmp/pp

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: /tmp/pp-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash family-games-android/ci/smoke.sh /tmp/pp-test /tmp/pp-build/FamilyGames.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test
          path: /tmp/pp-test

  publish:
    needs: [build, test]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/pp-all
      - name: Release (only when the commit message asks for it)
        if: contains(github.event.head_commit.message, '[release]') && needs.test.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=1.0.${{ github.run_number }}
          cp /tmp/pp-all/build/FamilyGames.apk FamilyGames.apk
          gh release create "family-games-v$V" FamilyGames.apk --title "Family Games installer $V" --notes-file family-games-android/RELEASE_NOTES.md --latest=false
          # a fixed "family-games" release always holds the newest one, so the link to send never changes
          gh release delete family-games --yes --cleanup-tag || true
          gh release create family-games FamilyGames.apk --title "Family Games installer (newest)" --notes-file family-games-android/RELEASE_NOTES.md --latest=false
      - name: Logs and screenshots to the games-ci branch
        run: |
          cd /tmp/pp-all
          echo "${{ github.run_number }} ${{ github.sha }} build=${{ needs.build.result }} test=${{ needs.test.result }}" > run.txt
          git init -q && git checkout -q -b games-ci
          git config user.name "fg-ci" && git config user.email "fg-ci@users.noreply.github.com"
          git add -A && git commit -qm "Family Games run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" games-ci
