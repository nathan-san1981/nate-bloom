name: Pocket Pet app (S10 FE+)

on:
  push:
    branches: [main]
    paths: ["pocketpet-android/**", ".github/workflows/pocketpet-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocketpet-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PP_VERSION_CODE: ${{ github.run_number }}
      PP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build the APK
        run: |
          mkdir -p /tmp/pp
          set -o pipefail
          gradle -p pocketpet-android assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/pp/build.log
          cp pocketpet-android/app/build/outputs/apk/release/app-release.apk /tmp/pp/PocketPet.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: /tmp/pp

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: /tmp/pp-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash pocketpet-android/ci/smoke.sh /tmp/pp-test /tmp/pp-build/PocketPet.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test
          path: /tmp/pp-test

  publish:
    needs: [build, test]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/pp-all
      - name: Release (only when the commit message asks for it)
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=1.0.${{ github.run_number }}
          cp /tmp/pp-all/build/PocketPet.apk "PocketPet-$V.apk"
          gh release create "pocket-pet-v$V" "PocketPet-$V.apk" --title "Pocket Pet for the S10 FE+ $V" --notes-file pocketpet-android/RELEASE_NOTES.md --latest=false
      - name: Logs and screenshots to the pet-ci branch
        run: |
          cd /tmp/pp-all
          echo "${{ github.run_number }} ${{ github.sha }} build=${{ needs.build.result }} test=${{ needs.test.result }}" > run.txt
          git init -q && git checkout -q -b pet-ci
          git config user.name "pp-ci" && git config user.email "pp-ci@users.noreply.github.com"
          git add -A && git commit -qm "Pocket Pet run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pet-ci
