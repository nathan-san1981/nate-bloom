name: Unicorn Clock app

on:
  push:
    branches: [main]
    paths: ["unicorn-android/**", ".github/workflows/unicorn-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unicorn-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UC_VERSION_CODE: ${{ github.run_number }}
      UC_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build the APK
        env:
          UC_KEY_PASS: ${{ secrets.UNICORN_KEY_PASS }}
        run: |
          mkdir -p /tmp/uc-logs
          set -o pipefail
          # private signing key when the UNICORN_KEY_PASS secret is set (never falls back once it is)
          if [ -n "$UC_KEY_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in unicorn-android/keystore/release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:UC_KEY_PASS
            export UC_KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "private key" > /tmp/uc-logs/signing.txt
          else
            echo "public test key (add the UNICORN_KEY_PASS secret to sign with the private key)" > /tmp/uc-logs/signing.txt
          fi
          gradle -p unicorn-android assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/uc-logs/build.log
          cp unicorn-android/app/build/outputs/apk/release/app-release.apk /tmp/uc-logs/UnicornClock.apk
          rm -f "$RUNNER_TEMP/release.jks"
          keytool -printcert -jarfile /tmp/uc-logs/UnicornClock.apk | grep -E "Owner|SHA256:" >> /tmp/uc-logs/signing.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: /tmp/uc-logs

  # Fire OS 7 is built on Android 9 (API 28) and Fire OS 8 on Android 11 (API 30)
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: /tmp/uc-build
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          pip install --quiet websocket-client
      - name: Fire-sized emulator checks
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          script: bash unicorn-android/ci/smoke.sh /tmp/uc-test/api${{ matrix.api }} /tmp/uc-build/UnicornClock.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-api${{ matrix.api }}
          path: /tmp/uc-test

  publish:
    needs: [build, test]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/uc-all
      - name: Release (only when the commit message asks for it)
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=1.0.${{ github.run_number }}
          cp /tmp/uc-all/build/UnicornClock.apk "UnicornClock-$V.apk"
          cp /tmp/uc-all/build/UnicornClock.apk UnicornClock.apk
          gh release create "unicorn-clock-v$V" "UnicornClock-$V.apk" UnicornClock.apk \
            --title "Unicorn Clock for Fire tablets $V" --notes-file unicorn-android/RELEASE_NOTES.md --latest=false
          # a fixed "unicorn-clock" release always holds the newest APK, so the download link never changes
          gh release delete unicorn-clock --yes --cleanup-tag || true
          gh release create unicorn-clock UnicornClock.apk \
            --title "Unicorn Clock for Fire tablets (newest)" --notes-file unicorn-android/RELEASE_NOTES.md --latest=false
      - name: Logs, screenshots and the APK to the unicorn-ci branch
        run: |
          cd /tmp/uc-all
          echo "${{ github.run_number }} ${{ github.sha }} build=${{ needs.build.result }} test=${{ needs.test.result }}" > run.txt
          git init -q && git checkout -q -b unicorn-ci
          git config user.name "uc-ci" && git config user.email "uc-ci@users.noreply.github.com"
          git add -A && git commit -qm "Unicorn Clock run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" unicorn-ci
