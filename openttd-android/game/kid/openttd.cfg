; Starting settings for Unicorn Railways (written on first start only)
[misc]
fullscreen = true
musicset = NoMusic
; finger-sized buttons on the Fire 7 (1024x600)
gui_scale = 200

[graphicsset]
name = OpenGFX

[soundsset]
name = OpenSFX

[gui]
; one finger moves her world
scroll_mode = 3
autoscroll = false
; a save every 10 minutes too (the app also saves when she leaves)
autosave_interval = 10
persistent_buildingtools = true
link_terraform_toolbar = false
show_finances = false

[game_creation]
map_x = 7
map_y = 7
landscape = temperate
land_generator = 1
amount_of_rivers = 0

[difficulty]
; nothing she can lose: unlimited money, nothing breaks, no disasters, no rivals
infinite_money = true
max_loan = 2000000
vehicle_breakdowns = 0
disasters = false
max_no_competitors = 0
construction_cost = 0
vehicle_costs = 0
number_towns = 1
industry_density = 1
terrain_type = 0
quantity_sea_lakes = 0
town_council_tolerance = 2
economy = 0

[vehicle]
never_expire_vehicles = true
plane_crashes = 0

[news_display]
arrival_player = off
arrival_other = off
accident = off
accident_other = off
company_info = off
open = off
close = off
economy = off
production_player = off
production_other = off
production_nobody = off
advice = off
new_vehicles = off
acceptance = off
subsidies = off
general = off

[network]
participate_survey = no
