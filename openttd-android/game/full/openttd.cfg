; Starting settings for OpenTTD on the Galaxy Tab S10 FE+ (written on first start only; your changes are kept)
[misc]
fullscreen = true
musicset = NoMusic
; -1 = size the interface from the screen's density (sharp on the 2560x1600 screen)
gui_scale = -1

[graphicsset]
name = OpenGFX

[soundsset]
name = OpenSFX

[gui]
; one finger drags the map (the touch layer turns a drag into a left-button drag)
scroll_mode = 3
autoscroll = false

[network]
participate_survey = no
